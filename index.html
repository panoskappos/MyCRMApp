<!doctype html>
<html lang="el">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="MyCRMApp - Σύστημα Διαχείρισης Πελατών & Εξοπλισμού" />
  <meta name="theme-color" content="#f0f9ff" />
  
  <!-- Πρόσθεσε αυτό για να αποτρέψεις το iOS Dark Mode να κάνει μαύρο το background -->
  <meta name="color-scheme" content="light" />

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Το 'default' διατηρεί τη status bar σε κανονική μορφή. Το 'black-translucent' είναι άλλη εναλλακτική -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyCRMApp" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap&subset=greek"
    rel="stylesheet">
  <title>MyCRMApp</title>
</head>

<!-- Πρόσθεσε το inline style εδώ -->
<body style="background-color: #ffffff; margin: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
